name: "🐛 Bug report"
description: Report an issue with a project
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        **Do not disclose security vulnerabilities here.** Report them privately according to SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example or steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the affected release or commit hash, if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: OS, runtime, hardware, and relevant logs or screenshots (remove secrets).
