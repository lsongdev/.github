name: "✨ Feature request"
description: Suggest a new feature or improvement
title: "[FEAT] "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and discussions first.
  - type: textarea
    id: use-case
    attributes:
      label: Problem or use case
      description: Describe the need rather than only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the expected behavior and possible alternatives.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, examples, mockups, or constraints (optional).
